id = "mplus"
name = "Mplus"
description = "Mplus (.inp) syntax highlighting, outline, and run tasks for Zed."
version = "0.1.0"
schema_version = 1
authors = ["YOUR NAME <you@example.com>"]
repository = "https://github.com/YOUR-USER/zed-mplus-extension"

# The grammar lives in this repository under tree-sitter-mplus/.
# Zed clones `repository` at `rev` and compiles <path>/src/parser.c (+ scanner.c).
#
# Local development: point at this folder and the commit that contains the
# generated src/parser.c:
#   repository = "file:///absolute/path/to/zed-mplus-extension"
# Publishing: use the GitHub URL and the full commit SHA.
[grammars.mplus]
repository = "file:///Users/francisco/Documents/GitHub/zed-mplus-extension"
rev = "main"
path = "tree-sitter-mplus"
